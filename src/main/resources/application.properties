spring.application.name=inhouse-manager
server.port=8081

# H2 (file DB: ./data/inhouse.mv.db)
spring.datasource.url=jdbc:h2:file:./data/inhouse
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 정적 파일(CSS 등) 주소에 내용 해시를 붙인다: /css/style-<해시>.css
# CSS를 고치면 주소가 바뀌어서 브라우저가 예전 파일(캐시)을 쓰지 않는다
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# 세션은 쿠키로만 주고받는다 (처음 방문할 때 주소에 ;jsessionid=... 가 붙지 않게)
server.servlet.session.tracking-modes=cookie
