<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>플레이어 등록</title>
</head>
<body>
<h1>플레이어 등록</h1>

<form th:action="@{/players}" th:object="${playerForm}" method="post">
    <div>
        <label for="name">이름</label>
        <input type="text" th:field="*{name}">
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red">이름 오류</p>
    </div>
    <div>
        <label for="riotId">라이엇 ID</label>
        <input type="text" th:field="*{riotId}" placeholder="이름#태그">
        <p th:if="${#fields.hasErrors('riotId')}" th:errors="*{riotId}" style="color: red">라이엇 ID 오류</p>
    </div>
    <div>
        <label for="mainPosition">주 포지션</label>
        <select th:field="*{mainPosition}">
            <option value="">선택하세요</option>
            <option th:each="pos : ${positions}" th:value="${pos}" th:text="${pos}">MID</option>
        </select>
        <p th:if="${#fields.hasErrors('mainPosition')}" th:errors="*{mainPosition}" style="color: red">포지션 오류</p>
    </div>
    <div>
        <label for="subPosition">부 포지션</label>
        <select th:field="*{subPosition}">
            <option value="">없음</option>
            <option th:each="pos : ${positions}" th:value="${pos}" th:text="${pos}">TOP</option>
        </select>
    </div>
    <button type="submit">등록</button>
</form>
<a th:href="@{/players}">목록으로</a>
</body>
</html>
