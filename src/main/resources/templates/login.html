<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 로그인')}">
    <meta charset="UTF-8">
    <title>관리자 로그인</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: header('')}"></th:block>

<main class="container auth">
    <div class="page-head">
        <div>
            <h1>관리자 로그인</h1>
            <p class="sub">휴지통에서 삭제한 플레이어와 경기 기록을 되돌릴 수 있어요.</p>
        </div>
    </div>

    <!-- param.error: 스프링 시큐리티가 로그인에 실패하면 /login?error 로 돌려보낸다 -->
    <p class="alert error" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않아요.</p>
    <p class="flash success" th:if="${param.logout}">로그아웃했습니다.</p>

    <!-- th:action 을 쓰면 CSRF 보안 토큰(숨은 칸)이 자동으로 들어간다 -->
    <form class="form card" th:action="@{/login}" method="post">
        <div class="form-row">
            <label class="title" for="username">아이디</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus>
        </div>
        <div class="form-row">
            <label class="title" for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password">
        </div>
        <div class="actions">
            <button class="btn primary" type="submit">로그인</button>
            <a class="btn" th:href="@{/players}">취소</a>
        </div>
    </form>
</main>
</body>
</html>
