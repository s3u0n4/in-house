<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>플레이어 목록</title>
</head>
<body>
<h1>플레이어 목록</h1>
<a th:href="@{/players/new}">플레이어 등록</a>

<table border="1">
    <thead>
    <tr>
        <th>이름</th>
        <th>라이엇 ID</th>
        <th>주 포지션</th>
        <th>부 포지션</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each = "player : ${players}">
        <td th:text="${player.name}">홍길동</td>
        <td th:text="${player.riotId}">Hong#KR1</td>
        <td th:text="${player.mainPosition}">MID</td>
        <td th:text="${player.subPosition}">TOP</td>
    </tr>
    <tr th:if="${#lists.isEmpty(players)}">
        <td colspan="4">등록된 플레이어가 없습니다.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
