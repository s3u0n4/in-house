<!doctype html>
<!-- 여러 화면이 같이 쓰는 조각(fragment) 모음. 각 화면에서 th:replace로 가져다 쓴다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · 내전 매니저'">내전 매니저</title>
    <!-- 글꼴은 Google Fonts에서 받는다: 한글 제목 Black Han Sans, 숫자와 영문 Oswald (인터넷이 안 되면 기본 글꼴) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@500;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- menu: 현재 메뉴 이름 (players, matches, ranking, teams). 해당 메뉴를 강조한다 -->
<th:block th:fragment="header(menu)">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" th:href="@{/}">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-text"><span class="brand-en">INHOUSE</span><span class="brand-ko">내전 매니저</span></span>
            </a>
            <nav class="nav">
                <a th:href="@{/players}" th:classappend="${menu == 'players'} ? 'active'">플레이어</a>
                <a th:href="@{/matches}" th:classappend="${menu == 'matches'} ? 'active'">경기 기록</a>
                <a th:href="@{/ranking}" th:classappend="${menu == 'ranking'} ? 'active'">랭킹</a>
                <a th:href="@{/teams}" th:classappend="${menu == 'teams'} ? 'active'">팀 나누기</a>
                <!-- isAdmin: AdminAdvice가 넘겨준다 (관리자로 로그인했으면 true) -->
                <a th:if="${isAdmin}" th:href="@{/admin/trash}" th:classappend="${menu == 'trash'} ? 'active'">휴지통</a>
            </nav>
            <div class="admin-menu">
                <form th:if="${isAdmin}" th:action="@{/logout}" method="post">
                    <button type="submit" class="link-button">로그아웃</button>
                </form>
                <a th:unless="${isAdmin}" th:href="@{/login}">관리자</a>
            </div>
        </div>
    </header>
    <div class="container">
        <p class="flash success" th:if="${message}" th:text="${message}">저장했습니다.</p>
        <p class="flash error" th:if="${errorMessage}" th:text="${errorMessage}">오류가 있습니다.</p>
    </div>
</th:block>

</body>
</html>
