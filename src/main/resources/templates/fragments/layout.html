<!doctype html>
<!-- 여러 화면이 같이 쓰는 조각(fragment) 모음. 각 화면에서 th:replace로 가져다 쓴다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · 내전 매니저'">내전 매니저</title>
    <!-- theme: ThemeAdvice가 쿠키에서 읽어 넘겨준다. 오류 화면처럼 값이 없으면 롤 테마 -->
    <!-- 글꼴은 Google Fonts에서 받는다 (인터넷이 안 되면 기본 글꼴로 보인다) -->
    <th:block th:switch="${theme}">
        <th:block th:case="'opgg'">
            <link rel="stylesheet" th:href="@{/css/opgg.css}">
        </th:block>
        <th:block th:case="'esports'">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@500;700&display=swap">
            <link rel="stylesheet" th:href="@{/css/esports.css}">
        </th:block>
        <th:block th:case="*">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
            <link rel="stylesheet" th:href="@{/css/style.css}">
        </th:block>
    </th:block>
</head>

<body>

<!-- menu: 현재 메뉴 이름 (players, matches, teams). 해당 메뉴를 강조한다 -->
<th:block th:fragment="header(menu)">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" th:href="@{/}">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-text"><span class="brand-en">INHOUSE</span><span class="brand-ko">내전 매니저</span></span>
            </a>
            <nav class="nav">
                <a th:href="@{/players}" th:classappend="${menu == 'players'} ? 'active'">플레이어</a>
                <a th:href="@{/matches}" th:classappend="${menu == 'matches'} ? 'active'">경기 기록</a>
                <a th:href="@{/teams}" th:classappend="${menu == 'teams'} ? 'active'">팀 나누기</a>
            </nav>
            <div class="theme-switch" aria-label="테마">
                <a th:href="@{/theme/lol}" th:classappend="${theme != 'opgg' and theme != 'esports'} ? 'active'">LoL</a>
                <a th:href="@{/theme/opgg}" th:classappend="${theme == 'opgg'} ? 'active'">OP.GG</a>
                <a th:href="@{/theme/esports}" th:classappend="${theme == 'esports'} ? 'active'">중계</a>
            </div>
        </div>
    </header>
    <div class="container">
        <p class="flash success" th:if="${message}" th:text="${message}">저장했습니다.</p>
        <p class="flash error" th:if="${errorMessage}" th:text="${errorMessage}">오류가 있습니다.</p>
    </div>
</th:block>

</body>
</html>
