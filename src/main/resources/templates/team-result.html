<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('팀 나누기 결과')}">
    <meta charset="UTF-8">
    <title>팀 나누기 결과</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: header('teams')}"></th:block>

<main class="container">
    <div class="page-head">
        <div>
            <h1>팀 나누기 결과</h1>
            <p class="sub">
                전력 차이 <strong th:text="${#numbers.formatDecimal(split.powerDiff(), 1, 1)}">0.4</strong>
                · 티어 분포 차이 <strong th:text="${#numbers.formatDecimal(split.distributionDiff(), 1, 1)}">2.0</strong>
            </p>
        </div>
    </div>

    <div class="teams">
        <section class="team" th:each="side : ${ {'BLUE', 'RED'} }"
                 th:with="lineup=${side == 'BLUE'} ? ${split.blue()} : ${split.red()}"
                 th:classappend="${side == 'RED'} ? 'red'">
            <h3 class="team-title">
                <span th:text="${side == 'BLUE'} ? '블루팀' : '레드팀'"
                      th:class="${side == 'BLUE'} ? 'team-blue' : 'team-red'">블루팀</span>
                <span class="team-score">평균
                    <span th:text="${lineup.averageTierLabel()}">골드</span>
                    · 전력 <span th:text="${#numbers.formatDecimal(lineup.power(), 1, 1)}">21.5</span></span>
            </h3>
            <div class="slot" th:each="a : ${lineup.assignments()}">
                <span class="slot-pos" th:text="${a.position()}">TOP</span>
                <span><span th:text="${a.player().name()}">철수</span>
                    <small class="tier-text" th:text="${a.player().tierLabel()}">골드</small></span>
                <span class="badge" th:classappend="|fit-${a.fit()}|" th:text="${a.fitLabel()}">주</span>
            </div>
        </section>
    </div>

    <p class="muted">전력 = 티어 점수(아이언 1 ~ 챌린저 10) + 내전 승률 보정(최대 ±2). 언랭과 티어 미입력은 오늘 참가자 평균 티어로 계산합니다.
        두 팀의 전력 합과 티어 분포(높은 순으로 1등끼리, 2등끼리 비교)가 비슷하도록 나누고, 비슷하면 포지션이 잘 맞는 쪽을 고릅니다.
        배지: <span class="badge fit-2">주</span> 주 포지션 · <span class="badge fit-1">부</span> 부 포지션
        · <span class="badge fit-0">-</span> 그 외</p>

    <div class="actions">
        <a class="btn primary"
           th:href="@{/matches/new(blue=${split.blue().playerIds()}, red=${split.red().playerIds()})}">이 팀으로 경기 기록</a>
        <a class="btn" th:href="@{/teams(playerIds=${playerIds})}">참가자 다시 고르기</a>
    </div>
</main>
</body>
</html>
