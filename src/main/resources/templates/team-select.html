<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('팀 나누기')}">
    <meta charset="UTF-8">
    <title>팀 나누기</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: header('teams')}"></th:block>

<main class="container">
    <!-- 데이터를 바꾸지 않으므로 GET으로 보낸다. 주소에 ?playerIds=1&playerIds=2... 가 붙는다 -->
    <form th:action="@{/teams/result}" method="get">
        <div class="page-head">
            <div>
                <h1>팀 나누기</h1>
                <p class="sub">참가할 <span th:text="${requiredCount}">10</span>명을 고르세요.</p>
            </div>
            <div class="actions">
                <span class="muted">선택 <strong id="selected-count" th:text="${#lists.size(selectedIds)}">0</strong>
                    / <span th:text="${requiredCount}">10</span></span>
                <button class="btn primary" type="submit">팀 나누기</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr><th></th><th>이름</th><th>주 포지션</th><th>부 포지션</th><th class="num">경기</th><th class="num">승률</th></tr>
                </thead>
                <tbody>
                <tr th:each="player : ${players}" th:with="s=${stats[player.id]}">
                    <td>
                        <input type="checkbox" name="playerIds" th:value="${player.id}"
                               th:id="|player-${player.id}|"
                               th:checked="${#lists.contains(selectedIds, player.id)}">
                    </td>
                    <td><label th:for="|player-${player.id}|" th:text="${player.name}">홍길동</label></td>
                    <td th:text="${player.mainPosition}">MID</td>
                    <td th:text="${player.subPosition} ?: '-'">-</td>
                    <td class="num" th:text="${s.games()}">0</td>
                    <td class="num" th:text="${s.winRateText()}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(players)}">
                    <td class="empty" colspan="6">등록된 플레이어가 없습니다. <a th:href="@{/players/new}">플레이어 등록하기</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </form>
</main>

<script>
    // 체크할 때마다 "선택 n / 10" 숫자를 바꾼다. 꺼져 있어도 서버에서 10명인지 다시 검사한다
    document.querySelectorAll('input[name=playerIds]').forEach(function (box) {
        box.addEventListener('change', function () {
            document.getElementById('selected-count').textContent =
                document.querySelectorAll('input[name=playerIds]:checked').length;
        });
    });
</script>
</body>
</html>
