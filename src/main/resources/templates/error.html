<!doctype html>
<!-- 404가 아닌 나머지 오류(400, 500 등)에 쓰는 화면. Whitelabel Error Page 대신 나온다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오류')}">
    <meta charset="UTF-8">
    <title>오류</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: header('')}"></th:block>

<main class="container">
    <div class="card">
        <h1>문제가 생겼습니다 <span class="muted" th:text="|(${status})|">(500)</span></h1>
        <p class="muted">잠시 후 다시 시도해 주세요. 계속되면 서버 로그를 확인하세요.</p>
        <a class="btn" th:href="@{/}">처음으로</a>
    </div>
</main>
</body>
</html>
