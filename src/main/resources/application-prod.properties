# 배포용 설정. 서버를 prod 프로필로 실행하면(환경 변수 SPRING_PROFILES_ACTIVE=prod)
# application.properties를 먼저 읽고, 같은 이름의 값은 이 파일 값으로 덮어쓴다.
#
# 비밀 값(DB 주소·계정, 관리자 비밀번호)은 이 파일에 적지 않는다 (GitHub 저장소가 public).
# 배포하는 곳의 "환경 변수" 화면에 넣으면 스프링 부트가 알아서 읽는다:
#   SPRING_DATASOURCE_URL       예) jdbc:postgresql://<호스트>:5432/<DB이름>?sslmode=require
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   INHOUSE_ADMIN_USERNAME
#   INHOUSE_ADMIN_PASSWORD

# DB: PostgreSQL (주소와 계정은 위 환경 변수)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 콘솔은 배포 서버에서 끈다
spring.h2.console.enabled=false

# 배포하는 곳이 정해 주는 포트(PORT 환경 변수)를 쓰고, 없으면 8080
server.port=${PORT:8080}
# 배포 서버 앞의 프록시가 HTTPS를 처리하므로, 원래 주소(https)를 알아내서 redirect에 쓴다
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# 관리자 비밀번호 환경 변수가 없으면 서버를 띄우지 않는다 (임시 비밀번호로 열리는 것을 막는다)
inhouse.admin.require-password=true
